[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-internship-bot"
version = "0.1.0"
description = "Daily remote internship email digest for applicants in India"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "python-dotenv>=1,<2",
  "PyYAML>=6.0,<7",
  "rapidfuzz>=3.0,<4",
  "beautifulsoup4>=4.12,<5",
  "python-jobspy>=1.1,<2",
]

[project.optional-dependencies]
dev = ["mypy>=1.8", "pytest>=8", "respx>=0.21", "ruff>=0.6", "types-PyYAML>=6"]

[project.scripts]
internship-bot = "internship_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"internship_bot.storage" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real job sources; excluded from default test runs"]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["internship_bot"]
mypy_path = "src"
