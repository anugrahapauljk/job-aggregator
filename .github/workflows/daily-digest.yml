name: Daily internship digest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *' # 09:00 India Standard Time

permissions:
  contents: write

concurrency:
  group: daily-internship-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      BOT_STATE_KEY: ${{ secrets.BOT_STATE_KEY }}
      EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT || secrets.SMTP_USERNAME }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install and check
        run: |
          python -m pip install -e '.[dev]'
          ruff check src tests
          ruff format --check src tests
          mypy src
          pytest -q
      - name: Restore delivery history
        run: |
          if [ -z "$BOT_STATE_KEY" ]; then
            echo 'BOT_STATE_KEY secret is required' >&2
            exit 1
          fi
          python -c 'import os; from cryptography.fernet import Fernet; Fernet(os.environ["BOT_STATE_KEY"].encode())'
          if [ -z "$EMAIL_RECIPIENT" ]; then
            echo 'EMAIL_RECIPIENT or SMTP_USERNAME secret is required' >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin bot-state >/dev/null; then
            git fetch origin bot-state
            mkdir -p data
            if git cat-file -e FETCH_HEAD:jobs.sqlite3.enc 2>/dev/null; then
              git show FETCH_HEAD:jobs.sqlite3.enc > data/jobs.sqlite3.enc
              python -m internship_bot.state decrypt data/jobs.sqlite3.enc data/jobs.sqlite3
            elif git cat-file -e FETCH_HEAD:jobs.sqlite3 2>/dev/null; then
              git show FETCH_HEAD:jobs.sqlite3 > data/jobs.sqlite3
            fi
          fi
      - name: Run digest
        id: bot
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOBSPY_PROXIES: ${{ secrets.JOBSPY_PROXIES }}
        run: python -m internship_bot run
      - name: Persist delivery history
        if: always() && steps.bot.outcome != 'skipped'
        run: |
          if [ -f data/jobs.sqlite3 ]; then
            python -m internship_bot.state encrypt data/jobs.sqlite3 data/jobs.sqlite3.enc
            if git ls-remote --exit-code --heads origin bot-state >/dev/null; then
              git fetch origin bot-state
              git worktree add --detach ../bot-state FETCH_HEAD
            else
              git worktree add --detach ../bot-state HEAD
              git -C ../bot-state switch --orphan bot-state
            fi
            cp data/jobs.sqlite3.enc ../bot-state/jobs.sqlite3.enc
            git -C ../bot-state rm -f --ignore-unmatch jobs.sqlite3
            git -C ../bot-state add jobs.sqlite3.enc
            if ! git -C ../bot-state diff --cached --quiet; then
              git -C ../bot-state -c user.name='internship-bot' \
                -c user.email='internship-bot@users.noreply.github.com' \
                commit -m 'Update internship delivery history'
            fi
            git -C ../bot-state push origin HEAD:bot-state
          fi
