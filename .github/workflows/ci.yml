name: Code checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      - run: pytest -q
